services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graceful-echo-app
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: graceful-echo-nginx
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
